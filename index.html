<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DIVO</title>
<style>
    body {
        margin: 0;
        background: black;
        overflow: hidden;
        font-family: 'Poppins', sans-serif;
    }

    /* Center container */
    #portal-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Portal ring */
    #portal {
        width: 220px;
        height: 220px;
        border: 4px solid #ffffff;
        border-radius: 50%;
        box-shadow: 0 0 25px #ffffff;
        opacity: 0;
    }

    /* DIVO text */
    #divo-text {
        color: white;
        font-size: 32px;
        margin-top: 25px;
        opacity: 0;
        letter-spacing: 4px;
    }

    /* Hologram message */
    #transmission {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #00eaff;
        font-size: 28px;
        letter-spacing: 3px;
        opacity: 0;
        text-shadow: 0 0 12px #00eaff, 0 0 25px #00eaff;
        animation: glitch 0.15s infinite alternate;
        pointer-events: none;
    }

    /* Portal pulse animation */
    @keyframes pulse {
        0% { transform: scale(1); box-shadow: 0 0 20px #fff; }
        50% { transform: scale(1.25); box-shadow: 0 0 45px #fff; }
        100% { transform: scale(1); box-shadow: 0 0 20px #fff; }
    }

    /* Collapse animation */
    @keyframes collapse {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(0.3); opacity: 0.4; }
    }

    /* Hologram glitch */
    @keyframes glitch {
        0% { transform: translate(-50%, -50%) skew(0deg); }
        100% { transform: translate(-50%, -50%) skew(1deg); }
    }
</style>
</head>
<body>

<div id="portal-container">
    <div id="portal"></div>
    <div id="divo-text">DIVO</div>
</div>

<div id="transmission">TRANSMISSION RECEIVED</div>

<script>
    const portal = document.getElementById("portal");
    const divoText = document.getElementById("divo-text");
    const container = document.getElementById("portal-container");
    const transmission = document.getElementById("transmission");

    let clickCount = 0;

    /* Step 1 — Fade in portal after 1 second */
    setTimeout(() => {
        container.style.transition = "opacity 1s ease";
        container.style.opacity = 1;

        portal.style.transition = "opacity 1s ease";
        portal.style.opacity = 1;

        divoText.style.transition = "opacity 1s ease";
        divoText.style.opacity = 1;

        /* Step 2 — Begin pulse sequence */
        let pulseCount = 0;
        const pulseInterval = setInterval(() => {
            pulseCount++;
            portal.style.animation = "pulse 1s ease";

            setTimeout(() => { portal.style.animation = ""; }, 1000);

            if (pulseCount === 4) {
                clearInterval(pulseInterval);

                /* Step 3 — Collapse + remove DIVO */
                setTimeout(() => {
                    portal.style.animation = "collapse 1s forwards";
                    divoText.style.opacity = 0;
                }, 500);
            }
        }, 1200);

    }, 1000);

    /* Secret triple-click */
    portal.addEventListener("click", () => {
        clickCount++;

        if (clickCount === 3) {
            transmission.style.transition = "opacity 1s ease";
            transmission.style.opacity = 1;
        }

        /* Reset click count after 2 seconds */
        setTimeout(() => { clickCount = 0; }, 2000);
    });
</script>

</body>
</html>
