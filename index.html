<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIVO Portal 2058</title>
<style>
  body {
    margin: 0;
    background: #ffffff;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
  }

  /* Circuit lines crawling inward */
  .line {
    position: absolute;
    background: #000;
    opacity: 0.9;
    animation: crawl 3s linear forwards;
  }

  @keyframes crawl {
    0% { transform: scaleX(0) scaleY(0); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: scaleX(1) scaleY(1); opacity: 1; }
  }

  /* Black portal forming */
  .portal {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 400px;
    height: 400px;
    margin-left: -200px;
    margin-top: -200px;
    border-radius: 50%;
    background: radial-gradient(circle, #000000 0%, #111111 40%, transparent 70%);
    animation: formPortal 4s ease forwards;
    opacity: 0;
  }

  @keyframes formPortal {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* DIVO logo emerging */
  .logo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 5rem;
    font-weight: 700;
    color: #000;
    letter-spacing: 0.3rem;
    opacity: 0;
    animation: reveal 5s ease forwards;
  }

  @keyframes reveal {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
</style>
</head>
<body>
  <div class="line" style="top:10%; left:0; width:100%; height:2px; animation-delay:0.2s;"></div>
  <div class="line" style="top:90%; left:0; width:100%; height:2px; animation-delay:0.4s;"></div>
  <div class="line" style="left:10%; top:0; width:2px; height:100%; animation-delay:0.6s;"></div>
  <div class="line" style="left:90%; top:0; width:2px; height:100%; animation-delay:0.8s;"></div>
  <div class="portal"></div>
  <div class="logo">DIVO</div>
</body>
</html>
