<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIVO Portal Transmission</title>

<style>
  body {
    background-color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  #portal {
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,255,0.15) 0%, rgba(0,0,0,1) 70%);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  #holoLogo {
    width: 160px;
    filter: drop-shadow(0 0 0px magenta);
    transition: filter 1.5s ease, transform 1.5s ease;
  }
</style>
</head>

<body>

<div id="portal">
  <img id="holoLogo" src="haus-of-holo.png" alt="Haus of Holo Logo">
</div>

<script>
  const portal = document.getElementById('portal');
  const logo = document.getElementById('holoLogo');
  let clickCount = 0;

  portal.addEventListener('click', () => {
    clickCount++;

    if (clickCount === 3) {
      // Magenta pulse
      logo.style.filter = 'drop-shadow(0 0 35px magenta)';
      logo.style.transform = 'scale(1.08)';

      setTimeout(() => {
        // Return to black-line state
        logo.style.filter = 'drop-shadow(0 0 0px magenta)';
        logo.style.transform = 'scale(1)';
      }, 1500);

      clickCount = 0;
    }
  });
</script>

</body>
</html>
