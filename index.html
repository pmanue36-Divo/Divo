<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIVO Portal</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #ffffff 70%, #000000 100%);
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Circuit pattern overlay */
    .circuit {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('circuit-pattern.svg');
      background-repeat: no-repeat;
      background-size: cover;
      opacity: 0.15;
      filter: brightness(0.2) contrast(1.3);
      z-index: 1;
    }

    /* Bleeding black effect */
    .bleed {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 40%;
      background: radial-gradient(circle at bottom, rgba(0,0,0,0.9) 0%, transparent 70%);
      z-index: 2;
    }

    /* Logo styling */
    .logo {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 5rem;
      font-weight: 700;
      color: #00ffff;
      letter-spacing: 0.3rem;
      text-shadow: 0 0 20px #00ffff;
      animation: fadeIn 2s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="circuit"></div>
  <div class="bleed"></div>
  <div class="logo">DIVO</div>
</body>
</html>
